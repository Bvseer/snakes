name = "snakes"
main = "server/worker.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# the game itself (index.html, game.js, sim.js, lib/) is served from here too; API paths fall through to the worker
[assets]
directory = "."
not_found_handling = "none"
